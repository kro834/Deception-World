/* Throwaway test page (safari worker): full-bleed stage; the page's own masthead and dock are hidden

   View buttons are still in the DOM (hidden) and are clicked from the test script. */
#stage{position:fixed!important;inset:0!important;width:auto!important;height:auto!important;min-height:0!important;max-height:none!important;margin:0!important;border:0!important;border-radius:0!important;z-index:0!important}

.fake.top{top:0;height:91px}.fake.bottom{bottom:0;height:184px}

<body>
<div class="fake top">floating controls (placeholder, 91 px)</div><div class="fake bottom">floating controls (placeholder, 184 px)</div>
<main class="app">
  <header class="masthead">
    <div class="brand">
      <h1>装甲戦士</h1>
      <span class="brand-tag" aria-hidden="true">3Dビューア</span>
    </div>
  </header>
  <div id="stage">
    <div id="fit" aria-hidden="true"></div>
    <div class="poster-slot">
      <img id="poster" src="./previews-v15/front.webp" alt="装甲戦士の正面プレビュー" fetchpriority="high" decoding="async">
    </div>
    <div class="stage-frame" aria-hidden="true"><span class="stage-label"></span></div>
    <div class="stage-progress" aria-hidden="true"></div>
    <div class="stage-hud">
      <p id="status" role="status">3Dモデルを読み込み中</p>
      <span id="progress" aria-hidden="true"></span>
    </div>
  </div>
  <footer class="dock">
    <div class="dock-bar">
      <p id="hint"><span class="hint-line">ドラッグで回転</span><span class="hint-sep"> · </span><span class="hint-line zoom-hint">ピンチ／スクロールで拡大・縮小</span></p>
      <button type="button" id="quality" aria-pressed="false" disabled>高精細に切替</button>
    </div>
    <nav aria-label="カメラの向き">
      <div class="view-group view-group--body" role="group" aria-labelledby="group-body">
        <span class="group-caption" id="group-body">全身</span>
        <button type="button" data-view="front" aria-pressed="true">正面</button>
        <button type="button" data-view="rear" aria-pressed="false">背面</button>
        <button type="button" data-view="side" aria-pressed="false">側面</button>
      </div>

      <div class="view-group view-group--detail" role="group" aria-labelledby="group-detail">
        <span class="group-caption" id="group-detail">部位</span>
        <button type="button" data-view="face" aria-pressed="false">顔</button>
        <button type="button" data-view="chest" aria-pressed="false">胸の炉</button>
        <button type="button" data-view="belt" aria-pressed="false">ベルト</button>
        <button type="button" data-view="belt-rear" aria-pressed="false">ベルト背面</button>
      </div>
    </nav>
  </footer>
</main>
<script>
// Start the standard model download as soon as the poster is in, while the scripts still load.
// viewer.js takes this response instead of fetching the file again (window.__earlyModel).
(function () {
  if (typeof WebGL2RenderingContext === 'undefined' || typeof AbortController === 'undefined') return;
  var early = window.__earlyModel = { url: new URL('./model-v10/standard-v14.glb', document.baseURI).href, controller: new AbortController(), response: null, taken: false };
  early.start = function () {
    if (!early.response) {
      early.response = fetch(early.url, { signal: early.controller.signal });
      early.response.catch(function () {});
    }
    return early.response;
  };
  var poster = document.getElementById('poster');
  if (poster.complete) early.start();
  else { poster.addEventListener('load', early.start, { once: true }); poster.addEventListener('error', early.start, { once: true }); }
})();
</script>
