name: Archive AI synthetic monitor

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "47 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Serialize monitoring and main promotion so a monitor can never roll back a newer release
# that appeared after its probes began.
concurrency:
  group: deception-world-production-main
  cancel-in-progress: false

env:
  ARCHIVE_AI_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
  VERCEL_CLI_VERSION: 59.10.0
  ARCHIVE_AI_VERIFY_TIMEOUT_MS: 180000

jobs:
  verify-and-recover-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out exact main history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Vercel CLI without deployment secrets
        run: npm install --global "vercel@$VERCEL_CLI_VERSION" --ignore-scripts

      - name: Require monitor and rollback credentials
        id: credentials
        shell: bash
        env:
          ARCHIVE_MONITOR_TOKEN: ${{ secrets.ARCHIVE_MONITOR_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "$ARCHIVE_AI_BASE_URL"
          test "${#ARCHIVE_MONITOR_TOKEN}" -ge 32
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          node -e 'const url = new URL(process.env.ARCHIVE_AI_BASE_URL); if (url.protocol !== "https:") process.exit(1)'

      - name: Resolve the exact deployment behind the Production alias
        id: production
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          node --input-type=module - "$GITHUB_OUTPUT" <<'NODE'
          import { appendFileSync } from "node:fs";
          import { resolveVercelProductionDeployment } from "./scripts/vercel-production-deployment.mjs";
          const [output] = process.argv.slice(2);
          const deployment = await resolveVercelProductionDeployment({
            baseUrl: process.env.ARCHIVE_AI_BASE_URL,
            token: process.env.VERCEL_TOKEN,
            teamId: process.env.VERCEL_ORG_ID,
            projectId: process.env.VERCEL_PROJECT_ID,
          });
          appendFileSync(output, `id=${deployment.id}\nurl=${deployment.url}\nsha=${deployment.sha}\n`);
          NODE

      - name: Prove the Production SHA belongs to main
        id: identity
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          production_sha="${{ steps.production.outputs.sha }}"
          if git cat-file -e "${production_sha}^{commit}" && git merge-base --is-ancestor "$production_sha" "$GITHUB_SHA"; then
            echo "verdict=pass" >> "$GITHUB_OUTPUT"
            echo "reason=production_sha_on_main" >> "$GITHUB_OUTPUT"
            if git cat-file -e "${production_sha}:migrations/0003_archive_ai_requests.sql" 2>/dev/null; then
              echo "durable=true" >> "$GITHUB_OUTPUT"
            else
              echo "durable=false" >> "$GITHUB_OUTPUT"
            fi
            if [ "$production_sha" = "$GITHUB_SHA" ]; then
              echo "current=true" >> "$GITHUB_OUTPUT"
            else
              # A failed or still-running main release can legitimately leave the last
              # healthy ancestor in Production. Newer monitor code must not judge that
              # older contract and roll it back another generation.
              echo "current=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          echo "verdict=rollback" >> "$GITHUB_OUTPUT"
          echo "reason=production_sha_not_on_main" >> "$GITHUB_OUTPUT"
          echo "current=false" >> "$GITHUB_OUTPUT"
          echo "durable=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Recover pending answers through the stable maintenance v1 contract
        id: maintenance
        if: steps.identity.outcome == 'success' && steps.identity.outputs.durable == 'true' && steps.identity.outputs.current != 'true'
        continue-on-error: true
        shell: bash
        env:
          ARCHIVE_MONITOR_TOKEN: ${{ secrets.ARCHIVE_MONITOR_TOKEN }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
        run: |
          set -euo pipefail
          args=(--base-url "$ARCHIVE_AI_BASE_URL" --expected-sha "${{ steps.production.outputs.sha }}" --monitor-token "$ARCHIVE_MONITOR_TOKEN" --github-output "$GITHUB_OUTPUT")
          if [ -n "$VERCEL_PROTECTION_BYPASS" ]; then
            args+=(--vercel-bypass-token "$VERCEL_PROTECTION_BYPASS")
          fi
          node scripts/archive-ai-maintenance-v1.mjs "${args[@]}"

      - name: Verify an older durable Production control plane without rollback authority
        id: ancestor_control
        if: steps.identity.outcome == 'success' && steps.identity.outputs.durable == 'true' && steps.identity.outputs.current != 'true'
        continue-on-error: true
        shell: bash
        env:
          ARCHIVE_MONITOR_TOKEN: ${{ secrets.ARCHIVE_MONITOR_TOKEN }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
        run: |
          set -euo pipefail
          args=(--base-url "$ARCHIVE_AI_BASE_URL" --expected-sha "${{ steps.production.outputs.sha }}" --monitor-token "$ARCHIVE_MONITOR_TOKEN" --control-plane-only)
          if [ -n "$VERCEL_PROTECTION_BYPASS" ]; then
            args+=(--vercel-bypass-token "$VERCEL_PROTECTION_BYPASS")
          fi
          node scripts/verify-archive-ai-deployment.mjs "${args[@]}"

      - name: Verify older durable Production model routes without rollback authority
        id: ancestor_routes
        if: steps.ancestor_control.outcome == 'success' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '47 */6 * * *')
        continue-on-error: true
        shell: bash
        env:
          ARCHIVE_MONITOR_TOKEN: ${{ secrets.ARCHIVE_MONITOR_TOKEN }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
        run: |
          set -euo pipefail
          args=(--phase all-routes --base-url "$ARCHIVE_AI_BASE_URL" --expected-sha "${{ steps.production.outputs.sha }}" --monitor-token "$ARCHIVE_MONITOR_TOKEN" --github-output "$GITHUB_OUTPUT")
          if [ -n "$VERCEL_PROTECTION_BYPASS" ]; then
            args+=(--vercel-bypass-token "$VERCEL_PROTECTION_BYPASS")
          fi
          node scripts/archive-ai-monitor-verdict.mjs "${args[@]}"

      - name: Verify Production control plane and maintenance
        id: control
        if: steps.identity.outcome == 'success' && steps.identity.outputs.current == 'true'
        continue-on-error: true
        shell: bash
        env:
          ARCHIVE_MONITOR_TOKEN: ${{ secrets.ARCHIVE_MONITOR_TOKEN }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
        run: |
          set -euo pipefail
          args=(--phase control-plane --base-url "$ARCHIVE_AI_BASE_URL" --expected-sha "${{ steps.production.outputs.sha }}" --monitor-token "$ARCHIVE_MONITOR_TOKEN" --github-output "$GITHUB_OUTPUT")
          if [ -n "$VERCEL_PROTECTION_BYPASS" ]; then
            args+=(--vercel-bypass-token "$VERCEL_PROTECTION_BYPASS")
          fi
          node scripts/archive-ai-monitor-verdict.mjs "${args[@]}"

      - name: Verify every selectable Production model route
        id: routes
        if: steps.control.outcome == 'success' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '47 */6 * * *')
        continue-on-error: true
        shell: bash
        env:
          ARCHIVE_MONITOR_TOKEN: ${{ secrets.ARCHIVE_MONITOR_TOKEN }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
        run: |
          set -euo pipefail
          args=(--phase all-routes --base-url "$ARCHIVE_AI_BASE_URL" --expected-sha "${{ steps.production.outputs.sha }}" --monitor-token "$ARCHIVE_MONITOR_TOKEN" --github-output "$GITHUB_OUTPUT")
          if [ -n "$VERCEL_PROTECTION_BYPASS" ]; then
            args+=(--vercel-bypass-token "$VERCEL_PROTECTION_BYPASS")
          fi
          node scripts/archive-ai-monitor-verdict.mjs "${args[@]}"

      - name: Roll back only a deployment-attributable Production failure
        id: rollback
        if: always() && steps.production.outcome == 'success' && (steps.identity.outputs.verdict == 'rollback' || steps.control.outputs.verdict == 'rollback' || steps.routes.outputs.verdict == 'rollback')
        shell: bash
        env:
          ARCHIVE_MONITOR_TOKEN: ${{ secrets.ARCHIVE_MONITOR_TOKEN }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          failed_id="${{ steps.production.outputs.id }}"
          failed_url="${{ steps.production.outputs.url }}"
          failed_sha="${{ steps.production.outputs.sha }}"

          # The failed deployment itself carries the exact URL/SHA captured by the
          # main release before promotion. Missing metadata on an older deployment
          # is alert-only: never fall back to Vercel's implicit rollback history.
          rollback_target="$(node --input-type=module - "$failed_id" "$failed_url" "$failed_sha" <<'NODE'
          import { resolveVercelRollbackTarget } from "./scripts/vercel-production-deployment.mjs";
          const [failedDeploymentId, failedUrl, failedSha] = process.argv.slice(2);
          const target = await resolveVercelRollbackTarget({
            baseUrl: process.env.ARCHIVE_AI_BASE_URL,
            failedDeploymentId,
            failedUrl,
            failedSha,
            token: process.env.VERCEL_TOKEN,
            teamId: process.env.VERCEL_ORG_ID,
            projectId: process.env.VERCEL_PROJECT_ID,
          });
          process.stdout.write(`${target.url} ${target.sha}`);
          NODE
          )"
          read -r previous_url previous_sha <<< "$rollback_target"
          test -n "$previous_url"
          test -n "$previous_sha"

          # The API resolver already fenced both deployments to VERCEL_PROJECT_ID.
          # Git ancestry is checked separately immediately before the mutation.
          git cat-file -e "${previous_sha}^{commit}"
          git merge-base --is-ancestor "$previous_sha" "$GITHUB_SHA"

          # Close the window between metadata/ancestry validation and mutation. A
          # manual Vercel promotion is outside GitHub concurrency, so re-resolve the
          # public alias immediately before the exact-target rollback.
          node --input-type=module - "$failed_url" "$failed_sha" <<'NODE'
          import { assertVercelProductionSnapshot } from "./scripts/vercel-production-deployment.mjs";
          const [expectedUrl, expectedSha] = process.argv.slice(2);
          await assertVercelProductionSnapshot({
            expectedUrl,
            expectedSha,
            baseUrl: process.env.ARCHIVE_AI_BASE_URL,
            token: process.env.VERCEL_TOKEN,
            teamId: process.env.VERCEL_ORG_ID,
            projectId: process.env.VERCEL_PROJECT_ID,
          });
          NODE

          vercel rollback "$previous_url" --timeout "5 m" --token "$VERCEL_TOKEN"
          vercel rollback status --timeout "5 m" --token "$VERCEL_TOKEN"

          restored=false
          for attempt in $(seq 1 12); do
            if node --input-type=module - "$previous_url" "$previous_sha" <<'NODE'
          import { resolveVercelProductionDeployment } from "./scripts/vercel-production-deployment.mjs";
          const [previousUrl, previousSha] = process.argv.slice(2);
          const restored = await resolveVercelProductionDeployment({
            baseUrl: process.env.ARCHIVE_AI_BASE_URL,
            token: process.env.VERCEL_TOKEN,
            teamId: process.env.VERCEL_ORG_ID,
            projectId: process.env.VERCEL_PROJECT_ID,
          });
          if (restored.url !== previousUrl || restored.sha !== previousSha) process.exit(1);
          NODE
            then
              restored=true
              break
            fi
            sleep 5
          done
          if [ "$restored" != "true" ]; then
            echo "Production did not return to the metadata-pinned previous deployment" >&2
            exit 1
          fi

          args=(--phase all-routes --base-url "$ARCHIVE_AI_BASE_URL" --expected-sha "$previous_sha" --monitor-token "$ARCHIVE_MONITOR_TOKEN")
          if [ -n "$VERCEL_PROTECTION_BYPASS" ]; then
            args+=(--vercel-bypass-token "$VERCEL_PROTECTION_BYPASS")
          fi
          node scripts/archive-ai-monitor-verdict.mjs "${args[@]}"
          echo "Production rolled back from $failed_url at $failed_sha to $previous_url at $previous_sha"

      - name: Fail the workflow to trigger incident email notification
        if: always() && (steps.credentials.outcome == 'failure' || steps.production.outcome == 'failure' || steps.identity.outcome == 'failure' || steps.maintenance.outcome == 'failure' || steps.ancestor_control.outcome == 'failure' || steps.ancestor_routes.outcome == 'failure' || steps.control.outcome == 'failure' || steps.routes.outcome == 'failure' || steps.rollback.outcome == 'failure')
        shell: bash
        run: |
          echo "::error title=Archive AI Production monitor failed::Review this workflow run. A deterministic app failure is rolled back; ambiguous provider or network incidents are alert-only."
          exit 1
