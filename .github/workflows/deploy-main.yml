name: Deploy verified main to Production

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deception-world-production-main
  cancel-in-progress: false

jobs:
  verify-stage-promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL || 'https://sand-zenith-meadow-dune.grok.me' }}
      VERCEL_CLI_VERSION: 59.10.0
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned Vercel CLI
        run: npm install --global "vercel@$VERCEL_CLI_VERSION" --ignore-scripts

      - name: Validate deployment credentials
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          missing=()
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID PUBLIC_BASE_URL; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error title=Missing deployment configuration::Set %s in the production environment.\n' "${missing[*]}"
            exit 1
          fi
          node -e 'const value = new URL(process.env.PUBLIC_BASE_URL); if (value.protocol !== "https:") process.exit(1)'

      - name: Install locked dependencies
        run: npm ci

      - name: Repository gates
        env:
          APPLY_DESTRUCTIVE_MIGRATIONS: "0"
        run: |
          npm run lint
          npm test
          npm run typecheck
          npm run build

      - name: Capture exact previous Production deployment
        id: previous
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          node --input-type=module - "$GITHUB_OUTPUT" <<'NODE'
          import { appendFileSync } from "node:fs";
          import { resolveVercelProductionDeployment } from "./scripts/vercel-production-deployment.mjs";
          const [output] = process.argv.slice(2);
          const deployment = await resolveVercelProductionDeployment({
            baseUrl: process.env.PUBLIC_BASE_URL,
            token: process.env.VERCEL_TOKEN,
            teamId: process.env.VERCEL_ORG_ID,
            projectId: process.env.VERCEL_PROJECT_ID,
          });
          appendFileSync(
            output,
            `id=${deployment.id}\nurl=${deployment.url}\nsha=${deployment.sha}\n`,
          );
          NODE

      - name: Verify previous Production belongs to main
        shell: bash
        run: |
          set -euo pipefail
          previous_sha="${{ steps.previous.outputs.sha }}"
          git cat-file -e "$previous_sha^{commit}"
          git merge-base --is-ancestor "$previous_sha" "$GITHUB_SHA"

      - name: Create staged Production candidate
        id: candidate
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          candidate_url="$(vercel deploy --prod --skip-domain --yes --token "$VERCEL_TOKEN" \
            --meta "githubCommitSha=$GITHUB_SHA" \
            --meta "archivePreviousProductionUrl=${{ steps.previous.outputs.url }}" \
            --meta "archivePreviousProductionSha=${{ steps.previous.outputs.sha }}" \
            --build-env "APPLY_DESTRUCTIVE_MIGRATIONS=0")"
          node -e 'const value = new URL(process.argv[1]); if (value.protocol !== "https:") process.exit(1)' "$candidate_url"
          echo "url=$candidate_url" >> "$GITHUB_OUTPUT"

      - name: Attest candidate identity and rollback metadata
        id: candidate_attestation
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          node --input-type=module - "$GITHUB_OUTPUT" "${{ steps.candidate.outputs.url }}" "$GITHUB_SHA" "${{ steps.previous.outputs.url }}" "${{ steps.previous.outputs.sha }}" <<'NODE'
          import { appendFileSync } from "node:fs";
          import { assertVercelCandidateRollbackMetadata } from "./scripts/vercel-production-deployment.mjs";
          const [output, candidateUrl, candidateSha, previousUrl, previousSha] = process.argv.slice(2);
          const candidate = await assertVercelCandidateRollbackMetadata({
            candidateUrl,
            candidateSha,
            previousUrl,
            previousSha,
            token: process.env.VERCEL_TOKEN,
            teamId: process.env.VERCEL_ORG_ID,
            projectId: process.env.VERCEL_PROJECT_ID,
          });
          appendFileSync(output, `id=${candidate.id}\n`);
          NODE

      - name: Smoke-test candidate and retired routes
        env:
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
        run: |
          args=(--base-url "${{ steps.candidate.outputs.url }}")
          if [ -n "$VERCEL_PROTECTION_BYPASS" ]; then
            args+=(--vercel-bypass-token "$VERCEL_PROTECTION_BYPASS")
          fi
          npm run verify:public -- "${args[@]}"

      - name: Fence Production before promotion
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          node --input-type=module - "${{ steps.previous.outputs.url }}" "${{ steps.previous.outputs.sha }}" <<'NODE'
          import { assertVercelProductionSnapshot } from "./scripts/vercel-production-deployment.mjs";
          const [expectedUrl, expectedSha] = process.argv.slice(2);
          await assertVercelProductionSnapshot({
            expectedUrl,
            expectedSha,
            baseUrl: process.env.PUBLIC_BASE_URL,
            token: process.env.VERCEL_TOKEN,
            teamId: process.env.VERCEL_ORG_ID,
            projectId: process.env.VERCEL_PROJECT_ID,
          });
          NODE

      - name: Promote verified candidate
        id: promote
        continue-on-error: true
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          vercel promote "${{ steps.candidate.outputs.url }}" --yes --timeout "5 m" --token "$VERCEL_TOKEN"

      - name: Verify Production before destructive cleanup
        id: production_probe
        if: steps.promote.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
        run: |
          set -euo pipefail
          node --input-type=module - "${{ steps.candidate.outputs.url }}" "$GITHUB_SHA" <<'NODE'
          import { assertVercelProductionSnapshot } from "./scripts/vercel-production-deployment.mjs";
          const [expectedUrl, expectedSha] = process.argv.slice(2);
          await assertVercelProductionSnapshot({
            expectedUrl,
            expectedSha,
            baseUrl: process.env.PUBLIC_BASE_URL,
            token: process.env.VERCEL_TOKEN,
            teamId: process.env.VERCEL_ORG_ID,
            projectId: process.env.VERCEL_PROJECT_ID,
          });
          NODE
          args=(--base-url "$PUBLIC_BASE_URL")
          if [ -n "$VERCEL_PROTECTION_BYPASS" ]; then
            args+=(--vercel-bypass-token "$VERCEL_PROTECTION_BYPASS")
          fi
          npm run verify:public -- "${args[@]}"

      - name: Apply destructive cleanup from the verified main SHA
        id: destructive_cleanup
        if: steps.production_probe.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          echo "started=true" >> "$GITHUB_OUTPUT"
          cleanup_url="$(vercel deploy --prod --skip-domain --force --yes --token "$VERCEL_TOKEN" \
            --meta "githubCommitSha=$GITHUB_SHA" \
            --meta "archivePreviousProductionUrl=${{ steps.previous.outputs.url }}" \
            --meta "archivePreviousProductionSha=${{ steps.previous.outputs.sha }}" \
            --meta "archiveDeploymentPhase=retirement-cleanup" \
            --build-env "APPLY_DESTRUCTIVE_MIGRATIONS=1")"
          node -e 'const value = new URL(process.argv[1]); if (value.protocol !== "https:") process.exit(1)' "$cleanup_url"
          node --input-type=module - "$cleanup_url" "$GITHUB_SHA" "${{ steps.previous.outputs.url }}" "${{ steps.previous.outputs.sha }}" <<'NODE'
          import { assertVercelCandidateRollbackMetadata } from "./scripts/vercel-production-deployment.mjs";
          const [candidateUrl, candidateSha, previousUrl, previousSha] = process.argv.slice(2);
          await assertVercelCandidateRollbackMetadata({
            candidateUrl,
            candidateSha,
            previousUrl,
            previousSha,
            token: process.env.VERCEL_TOKEN,
            teamId: process.env.VERCEL_ORG_ID,
            projectId: process.env.VERCEL_PROJECT_ID,
          });
          NODE
          echo "url=$cleanup_url" >> "$GITHUB_OUTPUT"

      - name: Verify Production after destructive cleanup
        id: post_cleanup_probe
        if: steps.destructive_cleanup.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
        run: |
          set -euo pipefail
          node --input-type=module - "${{ steps.candidate.outputs.url }}" "$GITHUB_SHA" <<'NODE'
          import { assertVercelProductionSnapshot } from "./scripts/vercel-production-deployment.mjs";
          const [expectedUrl, expectedSha] = process.argv.slice(2);
          await assertVercelProductionSnapshot({
            expectedUrl,
            expectedSha,
            baseUrl: process.env.PUBLIC_BASE_URL,
            token: process.env.VERCEL_TOKEN,
            teamId: process.env.VERCEL_ORG_ID,
            projectId: process.env.VERCEL_PROJECT_ID,
          });
          NODE
          args=(--base-url "$PUBLIC_BASE_URL")
          if [ -n "$VERCEL_PROTECTION_BYPASS" ]; then
            args+=(--vercel-bypass-token "$VERCEL_PROTECTION_BYPASS")
          fi
          npm run verify:public -- "${args[@]}"

      - name: Roll back only before destructive cleanup starts
        if: always() && steps.promote.outputs.attempted == 'true' && steps.destructive_cleanup.outputs.started != 'true' && (steps.promote.outcome != 'success' || steps.production_probe.outcome != 'success')
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          rollback_target="$(node --input-type=module - "${{ steps.candidate_attestation.outputs.id }}" "${{ steps.candidate.outputs.url }}" "$GITHUB_SHA" "${{ steps.previous.outputs.id }}" "${{ steps.previous.outputs.url }}" "${{ steps.previous.outputs.sha }}" <<'NODE'
          import {
            resolveVercelProductionDeployment,
            resolveVercelRollbackTarget,
          } from "./scripts/vercel-production-deployment.mjs";
          const [candidateId, candidateUrl, candidateSha, previousId, previousUrl, previousSha] =
            process.argv.slice(2);
          const options = {
            baseUrl: process.env.PUBLIC_BASE_URL,
            token: process.env.VERCEL_TOKEN,
            teamId: process.env.VERCEL_ORG_ID,
            projectId: process.env.VERCEL_PROJECT_ID,
          };
          const current = await resolveVercelProductionDeployment(options);
          if (
            current.id === previousId &&
            current.url === previousUrl &&
            current.sha === previousSha
          ) {
            process.exit(0);
          }
          if (
            current.id !== candidateId ||
            current.url !== candidateUrl ||
            current.sha !== candidateSha
          ) {
            throw new Error("Production moved to a third deployment; refusing an unsafe rollback");
          }
          const target = await resolveVercelRollbackTarget({
            ...options,
            failedDeploymentId: candidateId,
            failedUrl: candidateUrl,
            failedSha: candidateSha,
          });
          if (target.id !== previousId || target.url !== previousUrl || target.sha !== previousSha) {
            throw new Error("Attested rollback target no longer matches the captured Production");
          }
          process.stdout.write(target.url);
          NODE
          )"
          if [ -n "$rollback_target" ]; then
            vercel rollback "$rollback_target" --timeout "5 m" --token "$VERCEL_TOKEN"
            vercel rollback status --timeout "5 m" --token "$VERCEL_TOKEN"
            node --input-type=module - "${{ steps.previous.outputs.url }}" "${{ steps.previous.outputs.sha }}" <<'NODE'
            import { assertVercelProductionSnapshot } from "./scripts/vercel-production-deployment.mjs";
            const [expectedUrl, expectedSha] = process.argv.slice(2);
            await assertVercelProductionSnapshot({
              expectedUrl,
              expectedSha,
              baseUrl: process.env.PUBLIC_BASE_URL,
              token: process.env.VERCEL_TOKEN,
              teamId: process.env.VERCEL_ORG_ID,
              projectId: process.env.VERCEL_PROJECT_ID,
            });
            NODE
          fi

      - name: Fail release after unsuccessful promotion
        if: always() && (steps.promote.outcome != 'success' || steps.production_probe.outcome != 'success' || steps.destructive_cleanup.outcome != 'success' || steps.post_cleanup_probe.outcome != 'success')
        run: exit 1
